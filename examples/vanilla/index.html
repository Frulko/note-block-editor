<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nbe — demo</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <span class="brand">notion-block-editor <span class="tag">demo</span></span>
        <div class="actions">
          <button id="undo" title="Cmd+Z">↩︎ Undo</button>
          <button id="redo" title="Cmd+Shift+Z">↪︎ Redo</button>
        </div>
      </header>
      <main class="layout">
        <nav class="sidebar">
          <div class="sidebar-head">
            <span>Pages</span>
            <button id="new-page" title="Nouvelle page">＋</button>
          </div>
          <input id="search" class="search" type="search" placeholder="Rechercher…" autocomplete="off" />
          <div id="pages"></div>
          <div id="results" class="results" hidden></div>
          <button id="reset" class="reset-btn">Réinitialiser la démo</button>
        </nav>
        <div class="page-scroll">
          <nav id="crumbs" class="crumbs" aria-label="Fil d'Ariane"></nav>
          <div class="page" id="editor"></div>
          <section id="backlinks" class="backlinks" hidden></section>
        </div>
        <aside class="inspector">
          <nav class="tabs">
            <button data-tab="doc" class="active">Document</button>
            <button data-tab="ops">Transactions</button>
          </nav>
          <pre id="panel-doc" class="panel active"></pre>
          <div id="panel-ops" class="panel"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
