<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nbe — demo</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <span class="brand">notion-block-editor <span class="tag">demo</span></span>
        <div class="actions">
          <button id="toggle-pages" class="drawer-toggle" aria-expanded="false" aria-controls="sidebar" title="Pages">☰</button>
          <button id="undo" title="Cmd+Z">↩︎ Undo</button>
          <button id="redo" title="Cmd+Shift+Z">↪︎ Redo</button>
          <button id="export-json" title="Exporter la page en JSON">JSON</button>
          <button id="export-md" title="Exporter la page en Markdown">MD</button>
          <select id="theme" title="Thème">
            <option value="">Système</option>
            <option value="light">Clair</option>
            <option value="dark">Sombre</option>
          </select>
          <button id="toggle-inspector" class="drawer-toggle" aria-expanded="false" aria-controls="inspector" title="Inspecteur">{ }</button>
        </div>
      </header>
      <main class="layout">
        <div class="scrim" id="scrim" hidden></div>
        <nav class="sidebar" id="sidebar">
          <div class="sidebar-head">
            <span>Pages</span>
            <button id="new-page" title="Nouvelle page">＋</button>
          </div>
          <input id="search" class="search" type="search" placeholder="Rechercher…" autocomplete="off" />
          <div id="pages"></div>
          <div id="results" class="results" hidden></div>
          <button id="export-vault" class="reset-btn">Exporter en Markdown</button>
          <button id="import-vault" class="reset-btn">Importer un .zip</button>
          <input id="import-file" type="file" accept=".zip" hidden />
          <button id="reset" class="reset-btn">Réinitialiser la démo</button>
        </nav>
        <div class="page-scroll">
          <nav id="crumbs" class="crumbs" aria-label="Fil d'Ariane"></nav>
          <div class="page" id="editor"></div>
          <section id="backlinks" class="backlinks" hidden></section>
        </div>
        <aside class="inspector" id="inspector">
          <nav class="tabs">
            <button data-tab="doc" class="active">Document</button>
            <button data-tab="ops">Transactions</button>
            <button data-tab="comments">Commentaires <span id="comments-count" class="tab-badge"></span></button>
          </nav>
          <pre id="panel-doc" class="panel active"></pre>
          <div id="panel-ops" class="panel"></div>
          <div id="panel-comments" class="panel"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
