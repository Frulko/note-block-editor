name: CI & Deploy site

on:
  push:
    branches: [main]
  # every branch and every proposal is checked, not only what already landed:
  # a gate that runs after merging is a report, not a gate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Everything that can run at the same time does. The suites used to be six
# steps of one job, so the wall clock was their sum — 24 minutes to deploy a
# typo — and the first red one hid every suite after it: Chromium was broken
# for six runs, and the WebKit failure underneath was only found once it went
# green. Now each suite is a job, `fail-fast: false` reports all of them, and
# the site builds beside them instead of behind them.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # the editor's own faults have all been invisible to the model — a
  # painted-transparent drop indicator, a dead block-mode key contract — so the
  # browser suite is a gate rather than something run by hand.
  #
  # Two topologies × three engines, because both halves are gated:
  # `singleHostTopology` is the escape hatch for what the external evidence says
  # Notion left over iOS and Android roadblocks (docs/research/…-evidence.md),
  # and an escape hatch nobody runs is a story. WebKit is Safari's engine and
  # therefore iOS's; the mobile projects are the touch suite at the viewports it
  # ships at — not devices, no software keyboard and no IME, but the touch paths
  # run under something other than a desktop mouse.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topology: [per-block, single-host]
        suite: [chromium, webkit, mobile]
    name: e2e ${{ matrix.suite }} (${{ matrix.topology }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # only the engine this leg runs, rather than every engine in every leg
      - run: pnpm exec playwright install --with-deps ${{ matrix.suite == 'mobile' && 'chromium webkit' || matrix.suite }}
      - run: pnpm e2e ${{ matrix.suite == 'mobile' && '--project=mobile-safari --project=mobile-chrome' || format('--project={0}', matrix.suite) }}
        env:
          TOPOLOGY: ${{ matrix.topology }}
      # `test-results/`, not `playwright-report/`: CI runs the `line` reporter,
      # which writes no HTML report — the traces, videos and screenshots this
      # step exists for are all under `test-results/`. It had uploaded nothing
      # for every red run so far.
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.topology }}-${{ matrix.suite }}
          path: test-results/
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the API reference is generated, not versioned: without it the /docs/api/
      # pages build empty
      - run: pnpm docs:api
      - run: pnpm --filter site build
        env:
          BASE_PATH: /carnet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: [check, e2e, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
