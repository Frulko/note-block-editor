name: CI & Deploy site

on:
  push:
    branches: [main]
  # every branch and every proposal is checked, not only what already landed:
  # a gate that runs after merging is a report, not a gate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # the editor's own faults have all been invisible to the model — a
      # painted-transparent drop indicator, a dead block-mode key contract —
      # so the browser suite is a gate rather than something run by hand
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e --project=chromium
      # WebKit is Safari's engine and therefore iOS's, and the D1 evidence says
      # per-block contenteditable is exactly where iOS breaks. It found a real
      # bug on its first day (Blobs in IndexedDB) and a real product decision on
      # its second (the gutter). All four original differences are closed, so it
      # gates.
      - name: Browser suite on WebKit
        run: pnpm e2e --project=webkit
      # Touch, at the viewports it ships at. Not devices — no software keyboard
      # and no IME — but the touch paths run under Mobile Safari and Android
      # Chrome rather than only under a desktop mouse.
      - name: Touch suite on mobile viewports
        run: pnpm e2e --project=mobile-safari --project=mobile-chrome
      # The alternative editable boundary, gated like the default one.
      # External evidence says per-block contenteditable is what Notion left
      # over iOS and Android roadblocks (docs/research/…-evidence.md), so
      # `singleHostTopology` is the escape hatch — and an escape hatch nobody
      # runs is a story. It had never been run end to end; the first run found
      # twelve failures, all now fixed, so it gates.
      - name: Browser suite under the single-host topology
        run: TOPOLOGY=single-host pnpm e2e
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - run: pnpm docs:api
      - run: pnpm --filter site build
        env:
          BASE_PATH: /note-block-editor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
